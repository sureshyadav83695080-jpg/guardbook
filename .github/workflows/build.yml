name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - run: rm -f debug.keystore && keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - run: gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx3g
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v${{ github.run_number }} app/build/outputs/apk/debug/app-debug.apk --title "GuardBook APK" --notes "debug apk"
